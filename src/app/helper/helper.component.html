<mat-card>
  <ngb-alert [dismissible]="false" type="primary" >
    @if (isLoading) {
      <mat-spinner></mat-spinner>
    }

    <mat-card-header>
      <mat-card-title>Helper Login and Registration</mat-card-title>
      <mat-card-subtitle>Helpers can access login or registration page below.</mat-card-subtitle>

    </mat-card-header><hr><br>

    <div class="btn_div" style="text-align: center;">
      <div class="btn">
        <mat-card-title>Helper's Registration</mat-card-title>
        <mat-card-subtitle>Helpers who are new to this system should register at first.</mat-card-subtitle>
        <button mat-raised-button color="accent" [routerLink]="['/hsignup']" >Registration</button>
      </div>
      <div class="btn">
        <mat-card-title>Helper's LogIn</mat-card-title>
        <mat-card-subtitle>Helpers who are already registered can login to the system.</mat-card-subtitle>
        <button mat-raised-button color="accent" [routerLink]="['/hlogin']" >Login</button>
      </div>
    </div>
  </ngb-alert>
</mat-card>
