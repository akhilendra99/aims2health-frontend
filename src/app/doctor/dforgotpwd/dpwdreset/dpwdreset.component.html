<div style="background-color: rgb(253, 245, 242); color: rgb(63, 21, 1);">
  <div class="container-xxl">
    <div class="row pt-5 pb-5">
      <div class="col-lg-5 col-md-12">
        <a class="navbar-brand" href="#" class="pb-5">
          <img src="assets/images/logo/aims2health-with-caption.png" height="60" alt="" loading="lazy">
        </a>
        <div class="login-text-large">Welcome to AIMS2Health</div>
        <div>2<sup>nd</sup> opinion from Ex-AIIMS Specialist Doctors</div>
        <div class="hr-divider"></div>
        <!-- <div class="d-flex">
        <div class="mt-2 me-4">New User? </div><a type="button" class="btn btn-outline-danger ml-3" routerLink="/dsignup" >Register</a>
      </div> -->
      <div class="hr-divider text-center"></div>
      <div class="text-center p-1" style="margin-top: -40px;">Forgot Password?</div>
      <!-- Nav tabs -->
      <h3>Change Password (Doctor)</h3>
      <!-- <ul class="doctor-signin nav nav-tabs nav-justified" role="tablist">

      <li class="nav-item">
        <a class="nav-link active" data-bs-toggle="tab" href="#pass-signin2">Change Password (Patient)</a>
      </li>
    </ul> -->

    <!-- Tab panes -->
    <div class="tab-content">

      <div id="pass-signin2" class="container tab-pane active"><br>
        @if (!isLoading) {
          <form (submit)="onSave(pwdForm)"  #pwdForm="ngForm">
            <div class="mb-3">
              <label for="exampleInputEmail2" class="form-label">Password</label>
              <input
                matInput
                type="password"
                name="password"
                ngModel
                placeholder="New Password"
                #newPasswordInput="ngModel"
                required
                class="form-control"
                id="password"
                aria-describedby="emailHelp">
            </div>
            <div class="mb-3">
              <div class="d-flex justify-content-between">
                <label for="exampleInputPassword2" class="form-label">Rewrite Password</label>
                <!-- <a routerLink="/dforgotpassword" class="text-right">Forgot Password?</a> -->
              </div>
              <input
                matInput
                type="password"
                name="password2"
                ngModel
                placeholder="Confirm New Password"
                #newPassword2Input="ngModel"
                required
                class="form-control"
                id="password2">
            </div>
            <div class="mb-3 d-grid">
              @if (!isLoading) {
                <button type="submit" class="btn btn-success">Update Password</button>
              }
            </div>
          </form>
        }
      </div>
    </div>
  </div>
  <div class="col-lg-7 col-md-12">
    <img src="assets/images/featureimage-patient.svg" class="mx-auto d-block img-fluid" alt="main image pf the page" loading="lazy">
  </div>
</div>
</div>
<div class="container-fluid">
  <div class="d-flex justify-content-between">
    <p class="Polaris-Caption">© Copyright AIMS2Health 2021. All rights reserved.</p>
    <div class="d-flex">
      <a target="_blank" class="px-3" routerLink="/privacy-statement.html" >Terms of Use <i class="far fa-external-link"></i></a>
      <a target="_blank" class="px-3" routerLink="/privacy-statement.html" >Privacy &amp; Cookies <i class="fas fa-external-link"></i></a>
    </div>
  </div>
</div>
</div>
