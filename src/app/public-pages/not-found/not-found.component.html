<app-blank-header></app-blank-header>

<div class="container-fluid bg-a2h-dark text-white" id="header-text">
  <div class="container text-center py-5">
    <h1 style="font-size: 2.8rem; font-weight: 700">404 - Page Not Found</h1>
    <p class="lead mb-0" style="font-size: 1.2rem">
      The requested page could not be found.
    </p>
  </div>
</div>

<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="not-found-card p-4 p-md-5 shadow-sm rounded">
        <div class="mb-4">
          <i class="fa fa-exclamation-triangle text-warning" style="font-size: 4rem" aria-hidden="true"></i>
        </div>
        <h2 class="h3 font-weight-bold mb-3">Oops! Page not found</h2>
        <p class="text-muted mb-4">
          The link you followed may be broken, or the page may have been removed or relocated.
        </p>
        <div class="d-flex flex-wrap justify-content-center">
          <a routerLink="/" class="btn btn-success px-4 py-2 m-2">
            <i class="fa fa-home mr-1" aria-hidden="true"></i> Go to Home
          </a>
          <a routerLink="/contact-us" class="btn btn-outline-secondary px-4 py-2 m-2">
            <i class="fa fa-envelope-o mr-1" aria-hidden="true"></i> Contact Us
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
