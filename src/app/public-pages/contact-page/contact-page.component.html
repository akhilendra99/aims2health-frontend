<app-blank-header></app-blank-header>

<div class="container-fluid bg-a2h-dark text-white" id="header-text">
  <div
    class="container text-center"
    style="padding-top: 70px; padding-bottom: 70px"
  >
    <h1 style="font-size: 3rem">Contact Us</h1>
    <p style="font-size: 1.2rem">
      We’d love to hear from you. Fill out the form below to get in touch.
    </p>
  </div>
</div>

<div class="container py-5">
  <div class="row">
    <div class="col-md-6 mb-4">
      <h2>Our Office</h2>
      <div class="card shadow" style="border-radius: 12px">
        <div class="card-body">
          <address>
            <strong>AIMS2Health Pvt. Ltd.</strong><br />
            Block 28, G/F - H No 31<br />
            Old Rajinder Nagar<br />
            New Delhi 110060<br />
            <abbr title="Phone">Phone:</abbr> (+91)-8047165657
          </address>
          <address>
            <a href="mailto:info@aims2health.com">info&#64;aims2health.com</a>
          </address>
        </div>
      </div>
    </div>
    <div class="col-md-6 mb-4">
      <h2>Send Us a Message</h2>
      <form (ngSubmit)="submitForm()" #contactForm="ngForm">
        <div class="mb-3">
          <label for="firstName" class="form-label"
            >First Name <span style="color: red">*</span></label
          >
          <input
            type="text"
            class="form-control"
            id="firstName"
            [(ngModel)]="contact.first_name"
            name="first_name"
            required
          />
        </div>

        <div class="mb-3">
          <label for="lastName" class="form-label"
            >Last Name <span style="color: red">*</span></label
          >
          <input
            type="text"
            class="form-control"
            id="lastName"
            [(ngModel)]="contact.last_name"
            name="last_name"
            required
          />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            [(ngModel)]="contact.email"
            name="email"
            required
          />
        </div>

        <div class="mb-3">
          <label for="concern" class="form-label">Concern</label>
          <textarea
            class="form-control"
            id="concern"
            rows="4"
            [(ngModel)]="contact.concern"
            name="concern"
            required
          ></textarea>
        </div>

        <button type="submit" class="btn btn-primary px-4 py-2">Submit</button>
      </form>
    </div>
  </div>
</div>
